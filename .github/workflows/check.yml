name: Check rebuild

# On every push to the rebuild branch: type-check, layer rules, build, then photograph the
# frozen 8.1 app and the rebuilt app and fail if any picture or text differs.
on:
  push:
    branches: [rebuild, 'tally-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Type-check, layer rules, build
        run: npm run check

      - name: Same answers as 8.1 on random inputs
        run: node tests/equiv.mjs

      - name: Maintenance estimate against simulated people with known maintenance
        run: node tests/estimate.mjs

      - name: Storage (update from 8.1, saving, packing, going back to 8.1, crash, damage)
        run: node tests/storage.mjs

      - name: Copy a day (Add, Replace, Undo, empty day, 8.1 reads the result)
        run: node tests/copyday.mjs

      - name: How to use tour
        run: node tests/tour.mjs

      - name: Folding cards
        run: node tests/fold.mjs

      - name: Plate calculator, both sides or one side
        run: node tests/plates.mjs

      - name: Apply coaching to many movements
        run: node tests/coachapply.mjs

      - name: Full strength chart swaps out the oldest movement
        run: node tests/chartpick.mjs

      - name: Coaching headroom and lifted today
        run: node tests/headroom.mjs

      - name: Photograph 8.1 and the rebuild, then compare
        run: |
          node tests/record.mjs old
          node tests/record.mjs new
          node tests/compare.mjs old new

      - name: Keep the differences for a look
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: picture-differences
          path: tests/out/diff/
          if-no-files-found: ignore
