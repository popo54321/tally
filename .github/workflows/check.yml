name: Check

# On every push to a tally-* branch: type-check, layer rules, build, feature tests, then compare every
# calculation and every screen with the baseline version (tests/baseline.json). Differences fail unless
# tests/expected-changes.mjs lists them.
on:
  push:
    branches: [rebuild, 'tally-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the baseline version (tests/baseline.json) is an earlier commit

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Type-check, layer rules, build
        run: npm run check

      - name: Same answers as the baseline version on random inputs
        run: node tests/calc.mjs

      - name: Maintenance estimate against simulated people with known maintenance
        run: node tests/estimate.mjs

      - name: Storage (update from 8.1 data, saving, packing, going back a version, crash, damage)
        run: node tests/storage.mjs

      - name: Copy a day (Add, Replace, Undo, empty day, the previous version reads the result)
        run: node tests/copyday.mjs

      - name: How to use tour
        run: node tests/tour.mjs

      - name: Folding cards
        run: node tests/fold.mjs

      - name: Plate calculator, both sides or one side
        run: node tests/plates.mjs

      - name: Apply coaching to many movements
        run: node tests/coachapply.mjs

      - name: Full strength chart swaps out the oldest movement
        run: node tests/chartpick.mjs

      - name: Coaching headroom and lifted today
        run: node tests/headroom.mjs

      - name: Routines (workout, stretch, cardio), supersets, older versions, backups
        run: node tests/routines.mjs

      - name: Android self-update screens (with a stand-in for the native updater)
        run: node tests/selfupdate.mjs

      - name: Photograph the baseline version and the current build, then compare
        run: |
          node tests/record.mjs base
          node tests/record.mjs new
          node tests/compare.mjs

      - name: Keep the differences for a look
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: picture-differences
          path: tests/out/diff/
          if-no-files-found: ignore

  # The Android app built and signed with a throwaway key, so native code (Updater.java and friends) is
  # compiled and packaged on every push, not first at release time. Nothing is published.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Build with a throwaway key
        working-directory: android
        run: |
          export KEYSTORE="$RUNNER_TEMP/test.keystore" KEYSTORE_PASS=throwaway
          keytool -genkeypair -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -alias bodyandiron -dname "CN=Tally test build" -keyalg RSA -keysize 2048 -validity 2 > /dev/null 2>&1
          VN=$(grep -o "APP_VERSION = [\"'][0-9][0-9.]*" ../index.html | head -1 | grep -o "[0-9][0-9.]*$")
          PAGE=../index.html bash build.sh 1 "$VN"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump permissions "build/tally-$VN.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump xmltree --file AndroidManifest.xml "build/tally-$VN.apk" | grep -E "UpdateReceiver|MY_PACKAGE_REPLACED"

